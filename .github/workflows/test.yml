name: test
on: [push, pull_request]
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make test
  golden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make && sh tests/run-tests.sh && sh tests/check-docs.sh
  sanitize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make sanitize
  stress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make stress
      - name: unit suite under GC stress + sanitizers
        run: |
          make clean
          make EXTRA="-DFABLE_GC_STRESS -fsanitize=address,undefined,float-cast-overflow -fno-sanitize-recover=all -fno-omit-frame-pointer" build/test-unit
          UBSAN_OPTIONS=halt_on_error=1 ./build/test-unit
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make
      - name: differential fuzz vs python3 (several seeds)
        run: |
          for seed in 1 2 3 4 5 6 7 8 20261101; do
            python3 tests/fuzz.py --programs 100 --blobs 60 --seed "$seed"
          done
      - name: byte fuzz under sanitizers
        run: |
          make clean
          make EXTRA="-fsanitize=address,undefined,float-cast-overflow -fno-sanitize-recover=all -fno-omit-frame-pointer"
          UBSAN_OPTIONS=halt_on_error=1 python3 tests/fuzz.py --programs 50 --blobs 300
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 6.0.13
      - run: sh wasm/build.sh
      - run: make build/fable   # the smoke suite diffs wasm against the real CLI
      - run: node tests/wasm-smoke.js
      - name: committed demo matches a fresh build
        run: git diff --exit-code --stat docs/
