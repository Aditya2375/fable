name: test
on: [push, pull_request]
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make test
  golden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make && sh tests/run-tests.sh && sh tests/check-docs.sh
  sanitize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make sanitize
  stress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make stress
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make
      - name: differential fuzz vs python3
        run: python3 tests/fuzz.py --programs 300 --blobs 100
      - name: byte fuzz under sanitizers
        run: |
          make clean
          make EXTRA="-fsanitize=address,undefined,float-cast-overflow -fno-omit-frame-pointer"
          python3 tests/fuzz.py --programs 50 --blobs 300
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 6.0.13
      - run: sh wasm/build.sh
      - run: node tests/wasm-smoke.js
      - name: committed demo matches a fresh build
        run: git diff --exit-code --stat docs/
